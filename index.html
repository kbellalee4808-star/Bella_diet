<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16324B">
<title>벨라 · 오늘</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
:root{
  --ink:#16324B;
  --paper:#EDF0F3;
  --card:#FFFFFF;
  --line:#DFE5EB;
  --mute:#71828F;
  --faint:#9CAAB6;
  --c-move:#16324B;
  --c-food:#4A6B41;
  --c-water:#2C7196;
  --c-read:#6B4A63;
  --c-eng:#7C5C2E;
  --accent:var(--c-move);
  --tint:#EAEEF2;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
  padding-bottom:48px;
}
.wrap{max-width:520px;margin:0 auto}

/* ── header ───────────────────────── */
header{
  background:var(--tint);
  padding:calc(env(safe-area-inset-top) + 14px) 18px 0;
  transition:background .25s ease;
}
.datebar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.nav{
  width:34px;height:34px;flex:none;border:0;border-radius:50%;
  background:rgba(22,50,75,.07);color:var(--ink);
  font-size:16px;line-height:1;cursor:pointer;
}
.nav:active{background:rgba(22,50,75,.16)}
.nav:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.datemid{text-align:center;flex:1;min-width:0}
.dateline{font-size:13px;color:var(--mute);letter-spacing:.01em}
.weekline{font-size:22px;font-weight:700;margin-top:1px;letter-spacing:-.02em}
.dots{display:flex;justify-content:center;gap:7px;padding:12px 0 14px}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(22,50,75,.15);transition:background .2s}
.dot.on{background:var(--accent)}

/* ── tabs ─────────────────────────── */
nav.tabs{
  position:sticky;top:0;z-index:20;
  display:flex;background:var(--card);
  border-bottom:1px solid var(--line);
}
.tab{
  flex:1;border:0;background:none;padding:13px 2px 12px;
  font:inherit;font-size:15px;font-weight:600;color:var(--faint);
  cursor:pointer;position:relative;transition:color .18s;
}
.tab[aria-selected="true"]{color:var(--accent)}
.tab[aria-selected="true"]::after{
  content:"";position:absolute;left:14%;right:14%;bottom:-1px;height:3px;
  border-radius:3px 3px 0 0;background:var(--accent);
}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:-4px;border-radius:6px}
.tab .pip{
  display:block;width:5px;height:5px;border-radius:50%;
  background:var(--accent);margin:4px auto -9px;opacity:0;transition:opacity .2s;
}
.tab.done .pip{opacity:1}

/* ── panels ───────────────────────── */
main{padding:16px 14px 0}
.panel{display:none}
.panel.show{display:block}
.card{
  background:var(--card);border-radius:14px;margin-bottom:12px;
  box-shadow:0 1px 2px rgba(22,50,75,.06);overflow:hidden;
}
.card h2{
  margin:0;padding:15px 17px 13px;font-size:15px;font-weight:700;
  letter-spacing:-.01em;display:flex;align-items:center;justify-content:space-between;gap:10px;
  border-bottom:1px solid var(--line);
}
.badge{
  font-size:12px;font-weight:600;color:var(--accent);
  background:color-mix(in srgb,var(--accent) 10%,transparent);
  padding:4px 9px;border-radius:20px;white-space:nowrap;
}

/* rows */
.row{
  display:flex;align-items:flex-start;gap:13px;
  padding:14px 17px;border-bottom:1px solid var(--line);cursor:pointer;
}
.row:last-child{border-bottom:0}
.row:active{background:#F6F8FA}
.box{
  flex:none;width:23px;height:23px;margin-top:1px;border-radius:7px;
  border:2px solid #C6D0D9;background:#fff;position:relative;transition:.15s;
}
.row.on .box{background:var(--accent);border-color:var(--accent)}
.row.on .box::after{
  content:"";position:absolute;left:7px;top:3px;width:5px;height:10px;
  border:solid #fff;border-width:0 2px 2px 0;transform:rotate(43deg);
}
.rowbody{flex:1;min-width:0}
.rowtitle{font-size:16.5px;font-weight:600;letter-spacing:-.01em}
.rowsub{font-size:13.5px;color:var(--mute);margin-top:3px;line-height:1.45}
.row.on .rowtitle{color:var(--faint);text-decoration:line-through;text-decoration-thickness:1.5px}
.reps{
  flex:none;font-size:15px;font-weight:700;color:var(--accent);
  padding-top:1px;white-space:nowrap;
}
.row.on .reps{color:var(--faint)}

.tip{
  margin:0;padding:14px 17px;font-size:13.5px;line-height:1.6;
  color:var(--mute);background:#F6F8FA;
}

/* water */
.glasses{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:17px}
.glass{
  aspect-ratio:1/1.25;border:2px solid #C6D0D9;border-top-width:0;
  border-radius:3px 3px 11px 11px;background:#fff;cursor:pointer;
  display:flex;align-items:flex-end;justify-content:center;
  font-size:12px;color:var(--faint);padding-bottom:5px;transition:.15s;
}
.glass.on{background:var(--c-water);border-color:var(--c-water);color:#fff}
.wcount{font-size:14px;font-weight:600;color:var(--mute);padding:0 17px 16px;text-align:center}

/* note input */
.noteWrap{padding:13px 17px 16px;border-top:1px solid var(--line)}
.noteWrap label{display:block;font-size:13px;color:var(--mute);margin-bottom:7px}
input.note{
  width:100%;font:inherit;font-size:15.5px;color:var(--ink);
  border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:#FBFCFD;
}
input.note:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
input.note::placeholder{color:#B9C4CD}

/* buttons */
.ghost{
  display:block;width:calc(100% - 34px);margin:0 17px 17px;
  border:1.5px dashed #C6D0D9;background:#fff;border-radius:11px;
  padding:13px;font:inherit;font-size:15px;font-weight:600;color:var(--mute);cursor:pointer;
}
.ghost:active{background:#F6F8FA}
.ghost:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

footer{padding:18px 20px 30px;text-align:center;font-size:12.5px;color:var(--faint);line-height:1.7}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

<header id="hdr">
  <div class="datebar">
    <button class="nav" id="prev" aria-label="어제">‹</button>
    <div class="datemid">
      <div class="dateline" id="dateline">—</div>
      <div class="weekline" id="weekline">—</div>
    </div>
    <button class="nav" id="next" aria-label="내일">›</button>
  </div>
  <div class="dots" id="dots"></div>
</header>

<nav class="tabs" id="tabs" role="tablist"></nav>

<main>
  <section class="panel" id="p-move" role="tabpanel"></section>
  <section class="panel" id="p-food" role="tabpanel"></section>
  <section class="panel" id="p-water" role="tabpanel"></section>
  <section class="panel" id="p-read" role="tabpanel"></section>
  <section class="panel" id="p-eng" role="tabpanel"></section>
</main>

<footer id="foot"></footer>
</div>

<script>
/* ═══ 저장 ═══════════════════════════ */
const mem = {};
const store = {
  get(k){ try{ const v = localStorage.getItem(k); return v===null?mem[k]:v; }catch(e){ return mem[k]; } },
  set(k,v){ mem[k]=v; try{ localStorage.setItem(k,v); }catch(e){} }
};
function load(key){ const r = store.get('bella:'+key); if(!r) return {}; try{ return JSON.parse(r); }catch(e){ return {}; } }
function save(key,obj){ store.set('bella:'+key, JSON.stringify(obj)); }

/* ═══ 날짜 · 주차 ════════════════════ */
const START = new Date(2026,6,27);          // 1주차 시작 (월)
const DAYS = ['일','월','화','수','목','금','토'];
let cur = new Date(); cur.setHours(0,0,0,0);

function weekOf(d){
  const diff = Math.floor((d - START)/86400000);
  return Math.min(12, Math.max(1, Math.floor(diff/7)+1));
}
function key(d){ return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }

/* ═══ 운동 계획 ══════════════════════
   원칙: 근력 주 2회(월·목). 도구 없음. 무게 없음.
   못 한 날은 아무 날에나 '오늘 근력 하기'로 보충.       */
const PLAN = {
  1:{t:'몸 깨우기',  ex:[['스쿼트','10회 × 2'],['힙브릿지','12회 × 2'],['벽 푸시업','10회 × 2'],['플랭크','15초 × 2']],
     tip:'첫 주는 자세만 익히면 성공이야. 힘든 느낌보다 어디에 힘이 들어가는지 느껴봐.'},
  2:{t:'횟수 붙이기',ex:[['스쿼트','12회 × 2'],['힙브릿지','15회 × 2'],['무릎 푸시업','6회 × 2'],['플랭크','20초 × 2']],
     tip:'벽에서 바닥으로 내려오는 주. 무릎 푸시업이 힘들면 벽 푸시업 그대로 가도 돼.'},
  3:{t:'세트 늘리기',ex:[['스쿼트','12회 × 3'],['힙브릿지','15회 × 3'],['무릎 푸시업','8회 × 3'],['플랭크','20초 × 3']],
     tip:'세트 사이 1분씩 쉬어. 숨이 완전히 돌아오고 시작하는 게 자세에 좋아.'},
  4:{t:'깊이 늘리기',ex:[['스쿼트','15회 × 3'],['힙브릿지','15회 × 3'],['무릎 푸시업','10회 × 3'],['플랭크','25초 × 3']],
     tip:'스쿼트를 조금 더 깊게. 허벅지가 바닥과 나란해질 때까지가 목표야.'},
  5:{t:'천천히 내려가기',ex:[['스쿼트 · 3초 하강','12회 × 3'],['밴드 힙브릿지','15회 × 3'],['무릎 푸시업','10회 × 3'],['플랭크','25초 × 3']],
     tip:'내려갈 때 셋을 세고 올라올 때 하나. 무게 없이 강도를 올리는 가장 쉬운 방법이야.'},
  6:{t:'밴드 쓰기',  ex:[['밴드 스쿼트','15회 × 2'],['밴드 힙브릿지','15회 × 2'],['무릎 푸시업','10회 × 2'],['플랭크','25초 × 3']],
     tip:'골반밴드를 무릎 위에 걸고 바깥으로 미는 힘을 유지해. 무릎이 안으로 모이는 걸 막아주고 엉덩이가 훨씬 잘 쓰여.'},
  7:{t:'세트 되돌리기',ex:[['밴드 스쿼트','15회 × 3'],['밴드 힙브릿지','15회 × 3'],['무릎 푸시업','10회 × 3'],['플랭크','25초 × 3']],
     tip:'6주차와 같은 동작에 세트만 하나씩. 25초 3세트가 편해지면 그때 30초로 올려.'},
  8:{t:'배 잡기',    ex:[['밴드 스쿼트','15회 × 3'],['밴드 힙브릿지','15회 × 3'],['무릎 푸시업','12회 × 3'],['플랭크','30초 × 3'],['데드버그','10회 × 2']],
     tip:'데드버그는 허리를 바닥에 붙인 채로. 허리가 뜨면 팔다리를 덜 뻗어서 범위를 줄여.'},
  9:{t:'한쪽씩',     ex:[['밴드 스쿼트','15회 × 3'],['한 다리 힙브릿지','8회 × 3'],['무릎 푸시업','12회 × 3'],['플랭크','30초 × 3'],['데드버그','10회 × 3']],
     tip:'한쪽씩 하면 체중이 한 다리에 실려서 무게를 든 것과 비슷해져. 약한 쪽 먼저.'},
  10:{t:'버티기 늘리기',ex:[['밴드 스쿼트','18회 × 3'],['한 다리 힙브릿지','10회 × 3'],['무릎 푸시업','14회 × 3'],['플랭크','35초 × 3'],['데드버그','10회 × 3']],
     tip:'플랭크는 엉덩이가 올라가거나 처지기 시작하는 순간이 진짜 끝이야. 시계보다 자세를 봐.'},
  11:{t:'상체 올리기',ex:[['밴드 스쿼트','20회 × 3'],['한 다리 힙브릿지','12회 × 3'],['경사 푸시업','10회 × 3'],['플랭크','35초 × 3'],['데드버그','12회 × 3']],
     tip:'경사 푸시업은 손을 소파나 식탁에 올리고 하는 것. 무릎을 떼는 첫 단계야.'},
  12:{t:'마무리',    ex:[['밴드 스쿼트','20회 × 3'],['한 다리 힙브릿지','12회 × 3'],['경사 푸시업','12회 × 3'],['플랭크','40초 × 3'],['데드버그','12회 × 3']],
     tip:'12주 전 첫 주랑 비교해봐. 스쿼트 10회가 힘들었던 몸이 여기까지 온 거야.'}
};
const REST = [['스트레칭 10분','폼롤러로 허벅지 앞·옆, 엉덩이 옆 30초씩'],
              ['가볍게 걷기','안 해도 되는 날. 하면 다음 근력일이 편해'],];

const MEALS = [
  ['아침','계란 3개 · 채소 한 줌 · 밥 ⅔공기','약 25g'],
  ['점심','참치쌈장 또는 두부 · 쌈채소 · 현미밥 ⅔공기','약 28g'],
  ['저녁','소고기 100g 또는 순두부 · 애호박 계란전 · 샐러드','약 32g']
];

/* ═══ 탭 정의 ════════════════════════ */
const TABS = [
  {id:'move', label:'운동', color:'--c-move',  tint:'#EAEEF2'},
  {id:'food', label:'식단', color:'--c-food',  tint:'#ECF0EA'},
  {id:'water',label:'물',   color:'--c-water', tint:'#E8EFF3'},
  {id:'read', label:'독서', color:'--c-read',  tint:'#F0EAEF'},
  {id:'eng',  label:'영어', color:'--c-eng',   tint:'#F2EDE7'}
];
let active = 'move';

/* ═══ 렌더 ═══════════════════════════ */
function isStrengthDay(d, s){
  if(s.forceMove) return true;
  const w = d.getDay();
  return w===1 || w===4;              // 월 · 목
}

function render(){
  const k = key(cur), s = load(k), wk = weekOf(cur);
  const today = new Date(); today.setHours(0,0,0,0);
  const isToday = cur.getTime()===today.getTime();
  const plan = PLAN[wk];
  const strength = isStrengthDay(cur, s);

  document.getElementById('dateline').textContent =
    (cur.getMonth()+1)+'월 '+cur.getDate()+'일 '+DAYS[cur.getDay()] + (isToday?' · 오늘':'');
  document.getElementById('weekline').textContent = wk+'주차 — '+plan.t;

  /* 운동 */
  let h = '<div class="card"><h2>'+(strength?'근력 운동':'쉬는 날')+
          '<span class="badge">'+(strength?'주 2회 중 하루':'회복')+'</span></h2>';
  const list = strength ? plan.ex : REST;
  list.forEach((e,i)=>{
    h += row('move'+i, s, e[0], strength?'':e[1], strength?e[1]:'');
  });
  h += '<p class="tip">'+(strength?plan.tip:'몸이 붙는 건 쉬는 동안이야. 오늘 안 해도 계획대로 가는 중인 거 맞아.')+'</p></div>';
  if(!strength) h += '<button class="ghost" id="forceMove">오늘 근력 운동 하기</button>';
  else if(s.forceMove) h += '<button class="ghost" id="unforce">오늘은 쉬는 날로 되돌리기</button>';
  document.getElementById('p-move').innerHTML = h;

  /* 식단 */
  h = '<div class="card"><h2>오늘 식사<span class="badge">단백질 85~90g</span></h2>';
  MEALS.forEach((m,i)=> h += row('food'+i, s, m[0], m[1], m[2]));
  h += '<p class="tip">메뉴는 바뀌어도 괜찮아. 끼니마다 단백질 한 가지만 들어가면 그날은 맞은 거야.</p>';
  h += '<div class="noteWrap"><label for="foodNote">오늘 실제로 먹은 것</label>'+
       '<input class="note" id="foodNote" placeholder="예: 점심 약속 — 파스타랑 샐러드" value="'+esc(s.foodNote||'')+'"></div></div>';
  document.getElementById('p-food').innerHTML = h;

  /* 물 */
  const w = s.water|0;
  h = '<div class="card"><h2>물<span class="badge">하루 8잔 · 1.6L</span></h2><div class="glasses">';
  for(let i=0;i<8;i++) h += '<div class="glass'+(i<w?' on':'')+'" data-g="'+(i+1)+'">'+(i+1)+'</div>';
  h += '</div><div class="wcount">'+w+' / 8잔</div>'+
       '<p class="tip">한 번에 많이보다 자주 조금씩. 커피와 차는 잔 수에 안 넣는 게 계산이 편해.</p></div>';
  document.getElementById('p-water').innerHTML = h;

  /* 독서 */
  h = '<div class="card"><h2>독서<span class="badge">하루 20분</span></h2>' +
      row('read0', s, '20분 읽기', '자기 전이나 밥 먹고 바로가 붙이기 쉬워', '') +
      '<div class="noteWrap"><label for="readNote">읽는 책 · 오늘 어디까지</label>'+
      '<input class="note" id="readNote" placeholder="예: 채식주의자 — 88쪽" value="'+esc(s.readNote||'')+'"></div></div>';
  document.getElementById('p-read').innerHTML = h;

  /* 영어 */
  h = '<div class="card"><h2>영어 공부<span class="badge">하루 15분</span></h2>' +
      row('eng0', s, '15분 공부', '듣기든 단어든 상관없어. 매일 같은 시간이 중요해', '') +
      '<div class="noteWrap"><label for="engNote">오늘 한 것</label>'+
      '<input class="note" id="engNote" placeholder="예: 팟캐스트 1편 · 단어 20개" value="'+esc(s.engNote||'')+'"></div></div>';
  document.getElementById('p-eng').innerHTML = h;

  paintTabs(s, strength, list.length);
  bind(k);
  document.getElementById('foot').innerHTML =
    '12주 중 '+wk+'주차 · 못 챙긴 날이 있어도 계획은 계속 굴러가.';
}

function row(id, s, title, sub, reps){
  return '<div class="row'+(s[id]?' on':'')+'" data-k="'+id+'">'+
         '<div class="box"></div><div class="rowbody"><div class="rowtitle">'+title+'</div>'+
         (sub?'<div class="rowsub">'+sub+'</div>':'')+'</div>'+
         (reps?'<div class="reps">'+reps+'</div>':'')+'</div>';
}
function esc(t){ return String(t).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

/* 탭 · 진행 점 */
function paintTabs(s, strength, moveCount){
  const done = {
    move:  count(s,'move',moveCount)===moveCount,
    food:  count(s,'food',3)===3,
    water: (s.water|0)>=8,
    read:  !!s.read0,
    eng:   !!s.eng0
  };
  document.getElementById('tabs').innerHTML = TABS.map(t=>
    '<button class="tab'+(done[t.id]?' done':'')+'" role="tab" data-t="'+t.id+'" '+
    'aria-selected="'+(active===t.id)+'">'+t.label+'<span class="pip"></span></button>').join('');
  document.getElementById('dots').innerHTML =
    TABS.map(t=>'<div class="dot'+(done[t.id]?' on':'')+'"></div>').join('');
  TABS.forEach(t=>{
    document.getElementById('p-'+t.id).classList.toggle('show', active===t.id);
  });
  const t = TABS.find(x=>x.id===active);
  document.documentElement.style.setProperty('--accent','var('+t.color+')');
  document.getElementById('hdr').style.background = t.tint;
  document.querySelector('meta[name=theme-color]').setAttribute('content', t.tint);
}
function count(s,pre,n){ let c=0; for(let i=0;i<n;i++) if(s[pre+i]) c++; return c; }

/* ═══ 이벤트 ═════════════════════════ */
function bind(k){
  document.querySelectorAll('.row').forEach(el=>{
    el.onclick = ()=>{ const s=load(k); const id=el.dataset.k; s[id]=!s[id]; save(k,s); render(); };
  });
  document.querySelectorAll('.glass').forEach(el=>{
    el.onclick = ()=>{ const s=load(k); const g=+el.dataset.g;
      s.water = (s.water===g) ? g-1 : g; save(k,s); render(); };
  });
  ['foodNote','readNote','engNote'].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.oninput = ()=>{ const s=load(k); s[id]=el.value; save(k,s); };
  });
  const f = document.getElementById('forceMove');
  if(f) f.onclick = ()=>{ const s=load(k); s.forceMove=true; save(k,s); render(); };
  const u = document.getElementById('unforce');
  if(u) u.onclick = ()=>{ const s=load(k); s.forceMove=false; save(k,s); render(); };
}

document.getElementById('tabs').onclick = e=>{
  const b = e.target.closest('.tab'); if(!b) return;
  active = b.dataset.t; render();
};
document.getElementById('prev').onclick = ()=>{ cur.setDate(cur.getDate()-1); render(); };
document.getElementById('next').onclick = ()=>{ cur.setDate(cur.getDate()+1); render(); };

/* 좌우 스와이프로 탭 이동 */
let sx=0, sy=0;
document.addEventListener('touchstart', e=>{ sx=e.touches[0].clientX; sy=e.touches[0].clientY; }, {passive:true});
document.addEventListener('touchend', e=>{
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if(Math.abs(dx) < 55 || Math.abs(dy) > 45) return;
  const i = TABS.findIndex(t=>t.id===active);
  const n = dx<0 ? i+1 : i-1;
  if(n>=0 && n<TABS.length){ active = TABS[n].id; render(); }
}, {passive:true});

render();
</script>
</body>
</html>
