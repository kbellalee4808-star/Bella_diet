<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16324B">
<title>벨라 · 오늘</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
:root{
  --ink:#16324B;
  --paper:#EDF0F3;
  --card:#FFFFFF;
  --line:#DFE5EB;
  --mute:#71828F;
  --faint:#9CAAB6;
  --c-move:#16324B;
  --c-food:#4A6B41;
  --c-water:#2C7196;
  --c-read:#6B4A63;
  --c-eng:#7C5C2E;
  --accent:var(--c-move);
  --tint:#EAEEF2;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
  padding-bottom:48px;
}
.wrap{max-width:520px;margin:0 auto}
/* ── header ───────────────────────── */
header{
  background:var(--tint);
  padding:calc(env(safe-area-inset-top) + 14px) 18px 0;
  transition:background .25s ease;
}
.datebar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.nav{
  width:34px;height:34px;flex:none;border:0;border-radius:50%;
  background:rgba(22,50,75,.07);color:var(--ink);
  font-size:16px;line-height:1;cursor:pointer;
}
.nav:active{background:rgba(22,50,75,.16)}
.nav:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.datemid{text-align:center;flex:1;min-width:0}
.dateline{font-size:13px;color:var(--mute);letter-spacing:.01em}
.weekline{font-size:22px;font-weight:700;margin-top:1px;letter-spacing:-.02em}
.dots{display:flex;justify-content:center;gap:7px;padding:12px 0 14px}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(22,50,75,.15);transition:background .2s}
.dot.on{background:var(--accent)}
/* ── tabs ─────────────────────────── */
nav.tabs{
  position:sticky;top:0;z-index:20;
  display:flex;background:var(--card);
  border-bottom:1px solid var(--line);
}
.tab{
  flex:1;border:0;background:none;padding:13px 2px 12px;
  font:inherit;font-size:15px;font-weight:600;color:var(--faint);
  cursor:pointer;position:relative;transition:color .18s;
}
.tab[aria-selected="true"]{color:var(--accent)}
.tab[aria-selected="true"]::after{
  content:"";position:absolute;left:14%;right:14%;bottom:-1px;height:3px;
  border-radius:3px 3px 0 0;background:var(--accent);
}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:-4px;border-radius:6px}
.tab .pip{
  display:block;width:5px;height:5px;border-radius:50%;
  background:var(--accent);margin:4px auto -9px;opacity:0;transition:opacity .2s;
}
.tab.done .pip{opacity:1}
/* ── panels ───────────────────────── */
main{padding:16px 14px 0}
.panel{display:none}
.panel.show{display:block}
.card{
  background:var(--card);border-radius:14px;margin-bottom:12px;
  box-shadow:0 1px 2px rgba(22,50,75,.06);overflow:hidden;
}
.card h2{
  margin:0;padding:15px 17px 13px;font-size:15px;font-weight:700;
  letter-spacing:-.01em;display:flex;align-items:center;justify-content:space-between;gap:10px;
  border-bottom:1px solid var(--line);
}
.badge{
  font-size:12px;font-weight:600;color:var(--accent);
  background:color-mix(in srgb,var(--accent) 10%,transparent);
  padding:4px 9px;border-radius:20px;white-space:nowrap;
}
/* rows */
.row{
  display:flex;align-items:flex-start;gap:13px;
  padding:14px 17px;border-bottom:1px solid var(--line);cursor:pointer;
}
.row:last-child{border-bottom:0}
.row:active{background:#F6F8FA}
.box{
  flex:none;width:23px;height:23px;margin-top:1px;border-radius:7px;
  border:2px solid #C6D0D9;background:#fff;position:relative;transition:.15s;
}
.row.on .box{background:var(--accent);border-color:var(--accent)}
.row.on .box::after{
  content:"";position:absolute;left:7px;top:3px;width:5px;height:10px;
  border:solid #fff;border-width:0 2px 2px 0;transform:rotate(43deg);
}
.rowbody{flex:1;min-width:0}
.rowtitle{font-size:16.5px;font-weight:600;letter-spacing:-.01em}
.rowsub{font-size:13.5px;color:var(--mute);margin-top:3px;line-height:1.45}
.row.on .rowtitle{color:var(--faint);text-decoration:line-through;text-decoration-thickness:1.5px}
.reps{
  flex:none;font-size:15px;font-weight:700;color:var(--accent);
  padding-top:1px;white-space:nowrap;
}
.row.on .reps{color:var(--faint)}
.tip{
  margin:0;padding:14px 17px;font-size:13.5px;line-height:1.6;
  color:var(--mute);background:#F6F8FA;
}
/* 세트 진행 (근력 행) */
.setline{display:flex;align-items:center;gap:9px;margin-top:9px}
.sqs{display:flex;gap:4px}
.sq{width:24px;height:5px;border-radius:3px;background:#DDE4EA;transition:background .2s}
.sq.on{background:var(--accent)}
.row.on .sq.on{background:var(--faint)}
.golabel{font-size:12.5px;font-weight:600;color:var(--accent)}
.row.on .golabel{color:var(--faint)}
/* water */
.glasses{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:17px}
.glass{
  aspect-ratio:1/1.25;border:2px solid #C6D0D9;border-top-width:0;
  border-radius:3px 3px 11px 11px;background:#fff;cursor:pointer;
  display:flex;align-items:flex-end;justify-content:center;
  font-size:12px;color:var(--faint);padding-bottom:5px;transition:.15s;
}
.glass.on{background:var(--c-water);border-color:var(--c-water);color:#fff}
.wcount{font-size:14px;font-weight:600;color:var(--mute);padding:0 17px 16px;text-align:center}
/* note input */
.noteWrap{padding:13px 17px 16px;border-top:1px solid var(--line)}
.noteWrap label{display:block;font-size:13px;color:var(--mute);margin-bottom:7px}
input.note{
  width:100%;font:inherit;font-size:15.5px;color:var(--ink);
  border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:#FBFCFD;
}
input.note:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
input.note::placeholder{color:#B9C4CD}
/* buttons */
.ghost{
  display:block;width:calc(100% - 34px);margin:0 17px 17px;
  border:1.5px dashed #C6D0D9;background:#fff;border-radius:11px;
  padding:13px;font:inherit;font-size:15px;font-weight:600;color:var(--mute);cursor:pointer;
}
.ghost:active{background:#F6F8FA}
.ghost:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
footer{padding:18px 20px 30px;text-align:center;font-size:12.5px;color:var(--faint);line-height:1.7}

/* ══ 운동 실행 오버레이 ══════════════ */
.ov{
  position:fixed;inset:0;z-index:60;background:var(--paper);
  display:none;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 8px) 18px calc(env(safe-area-inset-bottom) + 18px);
  overflow-y:auto;
}
.ov.show{display:flex}
.ov-in{max-width:520px;margin:0 auto;width:100%;flex:1;display:flex;flex-direction:column}
.ov-back{
  background:none;border:0;font:inherit;font-size:15px;font-weight:600;color:var(--mute);
  cursor:pointer;padding:9px 0;align-self:flex-start;
}
.ov-eyebrow{font-size:12.5px;font-weight:700;letter-spacing:.06em;color:var(--accent);margin-top:6px}
.ov-title{font-size:26px;font-weight:700;letter-spacing:-.025em;margin-top:4px}
.ov-vol{font-size:15px;color:var(--mute);margin-top:5px}
.ov-sec{
  background:var(--card);border-radius:14px;padding:16px 17px;margin-top:13px;
  box-shadow:0 1px 2px rgba(22,50,75,.06);
}
.ov-sec h3{
  margin:0 0 9px;font-size:12px;font-weight:700;letter-spacing:.07em;color:var(--accent);
}
.ov-sec.care h3{color:var(--mute)}
.ov-sec p{margin:0;font-size:14.5px;line-height:1.72;color:var(--mute)}
.ov-sec ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px}
.ov-sec li{font-size:14.5px;line-height:1.62;color:var(--mute);padding-left:15px;position:relative}
.ov-sec li::before{
  content:"";position:absolute;left:0;top:9px;width:5px;height:5px;border-radius:50%;background:#C6D0D9;
}
.ov-sec li b{color:var(--ink);font-weight:700}
.ov-stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;min-height:230px;padding:12px 0}
.ov-head{text-align:center}
.ov-head .n{font-size:22px;font-weight:700;letter-spacing:-.02em}
.ov-head .s{
  display:inline-block;margin-top:8px;padding:5px 12px;border-radius:20px;
  background:color-mix(in srgb,var(--accent) 10%,transparent);
  color:var(--accent);font-size:12.5px;font-weight:700;
}
.tapzone{
  width:100%;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:18px;border:0;background:none;color:inherit;font:inherit;cursor:pointer;padding:6px;
  border-radius:16px;min-height:200px;transition:transform .08s ease;
}
.tapzone:active{transform:scale(.985)}
.tapzone:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bignum{font-size:clamp(80px,29vw,140px);font-weight:800;letter-spacing:-.045em;line-height:1}
.bignum small{font-size:.3em;font-weight:700;color:var(--faint);margin-left:6px;letter-spacing:0}
.pips{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;max-width:250px}
.pip2{width:13px;height:13px;border-radius:50%;background:#DDE4EA;transition:background .15s,transform .15s}
.pip2.on{background:var(--accent);transform:scale(1.1)}
.ov-hint{font-size:13.5px;color:var(--faint);text-align:center;padding:0 8px}
.ringbox{position:relative;width:min(66vw,240px);aspect-ratio:1}
.ringbox svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringbox circle{fill:none;stroke-linecap:round}
.ringbox .tr{stroke:#DDE4EA;stroke-width:7}
.ringbox .pg{stroke:var(--accent);stroke-width:7}
.ringbox.prep .pg{stroke:#C79A3C}
.ringbox.prep .rn{color:#C79A3C}
.ringin{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.rn{font-size:clamp(52px,16vw,76px);font-weight:800;letter-spacing:-.04em;line-height:1}
.rl{font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--faint)}
.nextbox{
  background:var(--card);border-radius:14px;padding:14px 16px;text-align:center;width:100%;
  box-shadow:0 1px 2px rgba(22,50,75,.06);
}
.nextbox .l{font-size:12px;font-weight:700;letter-spacing:.07em;color:var(--faint)}
.nextbox b{display:block;font-size:16.5px;font-weight:700;margin-top:4px}
.nextbox span{display:block;font-size:13.5px;color:var(--mute);margin-top:2px}
.ov-acts{display:flex;gap:9px;margin-top:16px}
.bt{
  flex:1;min-height:54px;border-radius:13px;border:1px solid transparent;font:inherit;
  font-size:15.5px;font-weight:700;cursor:pointer;transition:transform .08s;
}
.bt:active{transform:scale(.98)}
.bt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bt-fill{background:var(--accent);color:#fff}
.bt-line{background:#fff;color:var(--mute);border-color:var(--line)}
.bt-sm{flex:0 0 auto;padding:0 17px}
@keyframes bump{0%{transform:scale(1)}45%{transform:scale(1.13)}100%{transform:scale(1)}}
.bump{animation:bump .27s ease}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header id="hdr">
  <div class="datebar">
    <button class="nav" id="prev" aria-label="어제">‹</button>
    <div class="datemid">
      <div class="dateline" id="dateline">—</div>
      <div class="weekline" id="weekline">—</div>
    </div>
    <button class="nav" id="next" aria-label="내일">›</button>
  </div>
  <div class="dots" id="dots"></div>
</header>
<nav class="tabs" id="tabs" role="tablist"></nav>
<main>
  <section class="panel" id="p-move" role="tabpanel"></section>
  <section class="panel" id="p-food" role="tabpanel"></section>
  <section class="panel" id="p-water" role="tabpanel"></section>
  <section class="panel" id="p-read" role="tabpanel"></section>
  <section class="panel" id="p-eng" role="tabpanel"></section>
</main>
<footer id="foot"></footer>
</div>

<!-- 운동 실행 오버레이 -->
<div class="ov" id="ov">
  <div class="ov-in">
    <button class="ov-back" id="ovBack">‹ 닫기</button>

    <!-- 준비 -->
    <div id="ovPrep">
      <div class="ov-eyebrow" id="ovSet">1세트 / 3</div>
      <div class="ov-title" id="ovName">밴드 스쿼트</div>
      <div class="ov-vol" id="ovVol">15회</div>
      <div class="ov-sec"><h3>이 운동이 하는 일</h3><p id="ovWhy"></p></div>
      <div class="ov-sec care"><h3>주의</h3><ul id="ovCare"></ul></div>
      <div class="ov-acts"><button class="bt bt-fill" id="ovStart">시작</button></div>
    </div>

    <!-- 실행 -->
    <div id="ovRun" style="display:none;flex:1;flex-direction:column">
      <div class="ov-head">
        <div class="n" id="runName">밴드 스쿼트</div>
        <div class="s" id="runSet">1세트 / 3</div>
      </div>
      <div class="ov-stage">
        <button class="tapzone" id="tapzone" style="display:none">
          <div class="bignum"><span id="cNum">0</span><small id="cGoal">/15</small></div>
          <div class="pips" id="pips"></div>
          <div class="ov-hint">화면을 눌러서 세기</div>
        </button>
        <div class="ringbox" id="ringbox" style="display:none">
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <circle class="tr" cx="50" cy="50" r="45"></circle>
            <circle class="pg" id="pg" cx="50" cy="50" r="45" stroke-dasharray="282.74" stroke-dashoffset="0"></circle>
          </svg>
          <div class="ringin"><div class="rn" id="tNum">25</div><div class="rl" id="tLab">초</div></div>
        </div>
        <div class="ov-hint" id="runCue"></div>
      </div>
      <div class="ov-acts">
        <button class="bt bt-line bt-sm" id="ovUndo">되돌리기</button>
        <button class="bt bt-fill" id="ovDone">세트 완료</button>
      </div>
    </div>

    <!-- 휴식 -->
    <div id="ovRest" style="display:none;flex:1;flex-direction:column">
      <div class="ov-head"><div class="s">휴식</div></div>
      <div class="ov-stage">
        <div class="ringbox">
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <circle class="tr" cx="50" cy="50" r="45"></circle>
            <circle class="pg" id="rpg" cx="50" cy="50" r="45" stroke-dasharray="282.74" stroke-dashoffset="0"></circle>
          </svg>
          <div class="ringin"><div class="rn" id="rNum">30</div><div class="rl">초</div></div>
        </div>
        <div class="nextbox">
          <div class="l">다음</div>
          <b id="rNext">밴드 스쿼트</b>
          <span id="rSub">2세트 / 3 · 15회</span>
        </div>
      </div>
      <div class="ov-acts">
        <button class="bt bt-line bt-sm" id="rClose">목록</button>
        <button class="bt bt-line bt-sm" id="rPlus">+15초</button>
        <button class="bt bt-fill" id="rSkip">바로 시작</button>
      </div>
    </div>

  </div>
</div>

<script>
/* ═══ 저장 ═══════════════════════════ */
const mem = {};
const store = {
  get(k){ try{ const v = localStorage.getItem(k); return v===null?mem[k]:v; }catch(e){ return mem[k]; } },
  set(k,v){ mem[k]=v; try{ localStorage.setItem(k,v); }catch(e){} }
};
function load(key){ const r = store.get('bella:'+key); if(!r) return {}; try{ return JSON.parse(r); }catch(e){ return {}; } }
function save(key,obj){ store.set('bella:'+key, JSON.stringify(obj)); }
/* ═══ 날짜 · 주차 ════════════════════ */
const START = new Date(2026,6,27);          // 1주차 시작 (월)
const DAYS = ['일','월','화','수','목','금','토'];
let cur = new Date(); cur.setHours(0,0,0,0);
function weekOf(d){
  const diff = Math.floor((d - START)/86400000);
  return Math.min(12, Math.max(1, Math.floor(diff/7)+1));
}
function key(d){ return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
/* ═══ 운동 계획 ══════════════════════
   원칙: 근력 주 2회(월·목). 도구 없음. 무게 없음.
   못 한 날은 아무 날에나 '오늘 근력 하기'로 보충.       */
const PLAN = {
  1:{t:'몸 깨우기',  ex:[['스쿼트','10회 × 2'],['힙브릿지','12회 × 2'],['벽 푸시업','10회 × 2'],['플랭크','15초 × 2']],
     tip:'첫 주는 자세만 익히면 성공이야. 힘든 느낌보다 어디에 힘이 들어가는지 느껴봐.'},
  2:{t:'횟수 붙이기',ex:[['스쿼트','12회 × 2'],['힙브릿지','15회 × 2'],['무릎 푸시업','6회 × 2'],['플랭크','20초 × 2']],
     tip:'벽에서 바닥으로 내려오는 주. 무릎 푸시업이 힘들면 벽 푸시업 그대로 가도 돼.'},
  3:{t:'세트 늘리기',ex:[['스쿼트','12회 × 3'],['힙브릿지','15회 × 3'],['무릎 푸시업','8회 × 3'],['플랭크','20초 × 3']],
     tip:'세트 사이 1분씩 쉬어. 숨이 완전히 돌아오고 시작하는 게 자세에 좋아.'},
  4:{t:'깊이 늘리기',ex:[['스쿼트','15회 × 3'],['힙브릿지','15회 × 3'],['무릎 푸시업','10회 × 3'],['플랭크','25초 × 3']],
     tip:'스쿼트를 조금 더 깊게. 허벅지가 바닥과 나란해질 때까지가 목표야.'},
  5:{t:'천천히 내려가기',ex:[['스쿼트 · 3초 하강','12회 × 3'],['밴드 힙브릿지','15회 × 3'],['무릎 푸시업','10회 × 3'],['플랭크','25초 × 3']],
     tip:'내려갈 때 셋을 세고 올라올 때 하나. 무게 없이 강도를 올리는 가장 쉬운 방법이야.'},
  6:{t:'밴드 쓰기',  ex:[['밴드 스쿼트','15회 × 2'],['밴드 힙브릿지','15회 × 2'],['무릎 푸시업','10회 × 2'],['플랭크','25초 × 3']],
     tip:'골반밴드를 무릎 위에 걸고 바깥으로 미는 힘을 유지해. 무릎이 안으로 모이는 걸 막아주고 엉덩이가 훨씬 잘 쓰여.'},
  7:{t:'세트 되돌리기',ex:[['밴드 스쿼트','15회 × 3'],['밴드 힙브릿지','15회 × 3'],['무릎 푸시업','10회 × 3'],['플랭크','25초 × 3']],
     tip:'6주차와 같은 동작에 세트만 하나씩. 25초 3세트가 편해지면 그때 30초로 올려.'},

function guideOf(name){
  if(name.indexOf('스쿼트')>=0) return GUIDE.squat;
  if(name.indexOf('힙브릿지')>=0) return GUIDE.bridge;
  if(name.indexOf('푸시업')>=0) return GUIDE.pushup;
  if(name.indexOf('플랭크')>=0) return GUIDE.plank;
  if(name.indexOf('데드버그')>=0) return GUIDE.deadbug;
  return GUIDE.etc;
}
/* '15회 × 3' → {type:'reps', target:15, sets:3} */
function parseVol(v){
  const m = String(v).match(/(\d+)\s*(회|초)\s*×\s*(\d+)/);
  if(!m) return null;
  return { type: m[2]==='초' ? 'time':'reps', target:+m[1], sets:+m[3] };
}

function isStrengthDay(d, s){
  if(s.forceMove) return true;
  const w = d.getDay();
  return w===1 || w===4;              // 월 · 목

function render(){

  const today = new Date(); today.setHours(0,0,0,0);
  const isToday = cur.getTime()===today.getTime();

    if(strength){
      const p = parseVol(e[1]);

  if(!strength) h += '<button class="ghost" id="forceMove">오늘 근력 운동 하기</button>';

  /* 식단 */

  for(let i=0;i<8;i++) h += '<div class="glass'+(i<w?' on':'')+'" data-g="'+(i+1)+'">'+(i+1)+'</div>';
  h += '</div><div class="wcount">'+w+' / 8잔</div>'+
       '<p class="tip">한 번에 많이보다 자주 조금씩. 커피와 차는 잔 수에 안 넣는 게 계산이 편해.</p></div>';

  h = '<div class="card"><h2>독서<span class="badge">하루 20분</span></h2>' +

function row(id, s, title, sub, reps){
  return '<div class="row'+(s[id]?' on':'')+'" data-k="'+id+'">'+
         '<div class="box"></div><div class="rowbody"><div class="rowtitle">'+title+'</div>'+
         (sub?'<div class="rowsub">'+sub+'</div>':'')+'</div>'+
         (reps?'<div class="reps">'+reps+'</div>':'')+'</div>';
}
/* 근력 행 — 세트 진행 + 실행 화면 진입 */
function exRow(id, s, title, volText, p){
  const g = guideOf(title);
  const sets = p ? p.sets : 1;
  const done = Math.min(sets, s[id+'_s']|0);
  const full = !!s[id];
  let sq = '';
  for(let i=0;i<sets;i++) sq += '<div class="sq'+(i<done?' on':'')+'"></div>';
  const label = full ? '완료' : (done+1)+'세트 시작 ›';
  return '<div class="row'+(full?' on':'')+'" data-k="'+id+'" data-ex="1" '+
         'data-name="'+esc(title)+'" data-vol="'+esc(volText)+'">'+
         '<div class="box"></div>'+
         '<div class="rowbody"><div class="rowtitle">'+title+'</div>'+
         (g.short?'<div class="rowsub">'+g.short+'</div>':'')+
         '<div class="setline"><div class="sqs">'+sq+'</div>'+
         '<div class="golabel">'+label+'</div></div>'+
         '</div>'+
         '<div class="reps">'+volText+'</div></div>';
}
function esc(t){ return String(t).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
/* 탭 · 진행 점 */
function paintTabs(s, strength, moveCount){
  const done = {
    move:  count(s,'move',moveCount)===moveCount,
    food:  count(s,'food',3)===3,
    water: (s.water|0)>=8,
    read:  !!s.read0,
    eng:   !!s.eng0
  };
  document.getElementById('tabs').innerHTML = TABS.map(t=>
    '<button class="tab'+(done[t.id]?' done':'')+'" role="tab" data-t="'+t.id+'" '+
    'aria-selected="'+(active===t.id)+'">'+t.label+'<span class="pip"></span></button>').join('');
  document.getElementById('dots').innerHTML =
    TABS.map(t=>'<div class="dot'+(done[t.id]?' on':'')+'"></div>').join('');
  TABS.forEach(t=>{
    document.getElementById('p-'+t.id).classList.toggle('show', active===t.id);
  });
  const t = TABS.find(x=>x.id===active);
  document.documentElement.style.setProperty('--accent','var('+t.color+')');
  document.getElementById('hdr').style.background = t.tint;
  document.querySelector('meta[name=theme-color]').setAttribute('content', t.tint);
}
function count(s,pre,n){ let c=0; for(let i=0;i<n;i++) if(s[pre+i]) c++; return c; }
/* ═══ 이벤트 ═════════════════════════ */
function bind(k){
  document.querySelectorAll('.row').forEach(el=>{
    const box = el.querySelector('.box');
    const id = el.dataset.k;
    box.onclick = (ev)=>{
      ev.stopPropagation();
      const s = load(k); s[id] = !s[id];
      if(el.dataset.ex){
        const p = parseVol(el.dataset.vol);
        s[id+'_s'] = s[id] ? (p?p.sets:1) : 0;
      }
      save(k,s); render();
    };
    el.onclick = ()=>{
      if(el.dataset.ex && !load(k)[id]){
        openEx(k, id, el.dataset.name, el.dataset.vol);
      } else if(!el.dataset.ex){
        const s = load(k); s[id] = !s[id]; save(k,s); render();
      }
    };
  });
  document.querySelectorAll('.glass').forEach(el=>{
    el.onclick = ()=>{ const s=load(k); const g=+el.dataset.g;
      s.water = (s.water===g) ? g-1 : g; save(k,s); render(); };
  });
  ['foodNote','readNote','engNote'].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.oninput = ()=>{ const s=load(k); s[id]=el.value; save(k,s); };
  });
  const f = document.getElementById('forceMove');
  if(f) f.onclick = ()=>{ const s=load(k); s.forceMove=true; save(k,s); render(); };
  const u = document.getElementById('unforce');
  if(u) u.onclick = ()=>{ const s=load(k); s.forceMove=false; save(k,s); render(); };
}
document.getElementById('tabs').onclick = e=>{
  const b = e.target.closest('.tab'); if(!b) return;
  active = b.dataset.t; render();
};
document.getElementById('prev').onclick = ()=>{ cur.setDate(cur.getDate()-1); render(); };
document.getElementById('next').onclick = ()=>{ cur.setDate(cur.getDate()+1); render(); };
/* 좌우 스와이프로 탭 이동 */
let sx=0, sy=0;
document.addEventListener('touchstart', e=>{ sx=e.touches[0].clientX; sy=e.touches[0].clientY; }, {passive:true});
document.addEventListener('touchend', e=>{
  if(OV.open) return;
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if(Math.abs(dx) < 55 || Math.abs(dy) > 45) return;
  const i = TABS.findIndex(t=>t.id===active);
  const n = dx<0 ? i+1 : i-1;
  if(n>=0 && n<TABS.length){ active = TABS[n].id; render(); }
}, {passive:true});

/* ═══ 운동 실행 오버레이 ══════════════ */
const REST_SEC = 30, PREP_SEC = 5, CIRC = 282.74;
const OV = { open:false, k:'', id:'', name:'', type:'reps', target:0, sets:3, count:0 };
let raf=null, rRaf=null, startAt=0, totalMs=0, lastSec=-1, prep=false;
let rStart=0, rTotal=0, rLast=-1, wake=null, ac=null;
const $ = id => document.getElementById(id);

function audio(){
  try{
    if(!ac){ const C = window.AudioContext||window.webkitAudioContext; if(C) ac = new C(); }
    if(ac && ac.state==='suspended') ac.resume();
  }catch(e){}
  return ac;
}
function beep(f,d,v){
  const a=audio(); if(!a) return;
  try{
    const o=a.createOscillator(), g=a.createGain(), t=a.currentTime;
    o.type='sine'; o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(v||.25,t+.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+(d||.12));
    o.connect(g); g.connect(a.destination);
    o.start(t); o.stop(t+(d||.12)+.03);
  }catch(e){}
}
function chord(){ beep(660,.16,.22); setTimeout(()=>beep(880,.24,.22),120); }
function buzz(m){ try{ if(navigator.vibrate) navigator.vibrate(m); }catch(e){} }
function wakeOn(){
  try{
    if('wakeLock' in navigator && !wake){
      navigator.wakeLock.request('screen').then(w=>{ wake=w; w.addEventListener('release',()=>wake=null); }).catch(()=>{});
    }
  }catch(e){}
}
function wakeOff(){ try{ if(wake){ wake.release(); wake=null; } }catch(e){} }
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible' && OV.open) wakeOn(); });

function ovPhase(p){
  $('ovPrep').style.display = p==='prep' ? 'block':'none';
  $('ovRun').style.display  = p==='run'  ? 'flex':'none';
  $('ovRest').style.display = p==='rest' ? 'flex':'none';
}
function volText(){ return OV.type==='time' ? OV.target+'초' : OV.target+'회'; }

function openEx(k, id, name, vol){
  const p = parseVol(vol); if(!p) return;
  const s = load(k);
  OV.open=true; OV.k=k; OV.id=id; OV.name=name;
  OV.type=p.type; OV.target=p.target; OV.sets=p.sets;
  const doneSets = Math.min(p.sets, s[id+'_s']|0);
  const g = guideOf(name);
  $('ovSet').textContent = (doneSets+1)+'세트 / '+p.sets;
  $('ovName').textContent = name;
  $('ovVol').textContent = volText();
  $('ovWhy').textContent = g.why;
  $('ovCare').innerHTML = g.care.map(c=>'<li>'+c+'</li>').join('');
  ovPhase('prep');
  $('ov').classList.add('show');
  document.body.style.overflow='hidden';
}
function closeEx(){
  OV.open=false; stopT(); cancelAnimationFrame(rRaf); wakeOff();
  $('ov').classList.remove('show');
  document.body.style.overflow='';
  render();
}
$('ovBack').onclick = closeEx;
$('rClose').onclick = closeEx;

$('ovStart').onclick = ()=>{ audio(); beep(700,.1,.15); runSet(); };

function runSet(){
  wakeOn();
  const s = load(OV.k);
  const doneSets = Math.min(OV.sets, s[OV.id+'_s']|0);
  const g = guideOf(OV.name);
  $('runName').textContent = OV.name;
  $('runSet').textContent = (doneSets+1)+'세트 / '+OV.sets;
  $('runCue').textContent = g.care.length ? g.care[0].replace(/<[^>]+>/g,'') : '';
  ovPhase('run');
  if(OV.type==='reps'){
    OV.count = 0;
    $('tapzone').style.display='flex'; $('ringbox').style.display='none';
    $('ovUndo').style.display=''; $('ovDone').textContent='세트 완료';
    $('cGoal').textContent='/'+OV.target;
    paintPips();
  } else {
    $('tapzone').style.display='none'; $('ringbox').style.display='block';
    $('ovUndo').style.display='none'; $('ovDone').textContent='중단';
    startT(PREP_SEC, true);
  }
}
function paintPips(){
  $('cNum').textContent = OV.count;
  let d=''; for(let i=0;i<OV.target;i++) d += '<div class="pip2'+(i<OV.count?' on':'')+'"></div>';
  $('pips').innerHTML = d;
}
$('tapzone').onclick = ()=>{
  if(OV.count >= OV.target) return;
  OV.count++; paintPips(); buzz(12);
  const n=$('cNum'); n.classList.remove('bump'); void n.offsetWidth; n.classList.add('bump');
  if(OV.count===OV.target){ chord(); buzz([30,60,30]); setTimeout(setDone,420); }
  else if(OV.count >= OV.target-3){ beep(560,.07,.14); }
};
$('ovUndo').onclick = ()=>{ if(OV.count>0){ OV.count--; paintPips(); } };
$('ovDone').onclick = ()=>{ if(OV.type==='time') stopT(); setDone(); };

function startT(sec, isPrep){
  prep = !!isPrep; totalMs = sec*1000; startAt = Date.now(); lastSec=-1;
  $('ringbox').classList.toggle('prep', prep);
  $('tLab').textContent = prep ? '준비':'초';
  cancelAnimationFrame(raf); raf = requestAnimationFrame(tick);
}
function stopT(){ cancelAnimationFrame(raf); raf=null; }
function tick(){
  let left = totalMs - (Date.now()-startAt); if(left<0) left=0;
  const sec = Math.ceil(left/1000);
  $('tNum').textContent = sec;
  $('pg').setAttribute('stroke-dashoffset', String(CIRC*(1-left/totalMs)));
  if(sec!==lastSec && sec<=3 && sec>0){ lastSec=sec; beep(prep?520:620,.08,.18); buzz(15); }
  if(left<=0){
    stopT();
    if(prep){ chord(); buzz(40); startT(OV.target,false); }
    else{ chord(); buzz([40,80,40]); setTimeout(setDone,350); }
    return;
  }
  raf = requestAnimationFrame(tick);
}
function setDone(){
  const s = load(OV.k);
  const n = Math.min(OV.sets, (s[OV.id+'_s']|0) + 1);
  s[OV.id+'_s'] = n;
  if(n >= OV.sets) s[OV.id] = true;
  save(OV.k, s);
  if(n >= OV.sets){ chord(); closeEx(); return; }
  startRest();
}
function startRest(){
  const s = load(OV.k);
  const doneSets = Math.min(OV.sets, s[OV.id+'_s']|0);
  $('rNext').textContent = OV.name;
  $('rSub').textContent = (doneSets+1)+'세트 / '+OV.sets+' · '+volText();
  ovPhase('rest');
  rTotal = REST_SEC*1000; rStart = Date.now(); rLast=-1;
  cancelAnimationFrame(rRaf); rRaf = requestAnimationFrame(rTick);
}
function rTick(){
  let left = rTotal-(Date.now()-rStart); if(left<0) left=0;
  const sec = Math.ceil(left/1000);
  $('rNum').textContent = sec;
  $('rpg').setAttribute('stroke-dashoffset', String(CIRC*(1-left/rTotal)));
  if(sec!==rLast && sec<=3 && sec>0){ rLast=sec; beep(520,.08,.18); buzz(15); }
  if(left<=0){ cancelAnimationFrame(rRaf); chord(); buzz(40); runSet(); return; }
  rRaf = requestAnimationFrame(rTick);
}
$('rPlus').onclick = ()=>{ rTotal += 15000; };
$('rSkip').onclick = ()=>{ cancelAnimationFrame(rRaf); runSet(); };

render();
</script>
</body>
</html>
